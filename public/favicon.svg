<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 48 48"
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>

    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9A8D4"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="0"
        dy="2"
        stdDeviation="2"
        flood-opacity=".25"
      />
    </filter>
  </defs>

  <!-- Rounded app-icon background -->
  <rect
    width="48"
    height="48"
    rx="12"
    fill="url(#bg)"
  />

  <!-- Everly-Sa connected ribbon / E -->
  <path
    d="M14 13
       C14 11.9 14.9 11 16 11
       H32
       C33.1 11 34 11.9 34 13
       V16
       H20
       V20
       H30
       C31.1 20 32 20.9 32 22
       V25
       H20
       V29
       H34
       V32
       C34 33.1 33.1 34 32 34
       H16
       C14.9 34 14 33.1 14 32
       Z"
    fill="white"
    opacity=".96"
    filter="url(#shadow)"
  />

  <!-- Heart -->
  <path
    d="M31.5 30
       C29.2 27.9 26 25.6 26 22.5
       C26 20.6 27.4 19.2 29.2 19.2
       C30.3 19.2 31.3 19.8 32 20.7
       C32.7 19.8 33.7 19.2 34.8 19.2
       C36.6 19.2 38 20.6 38 22.5
       C38 25.6 34.8 27.9 32.5 30
       Z"
    fill="url(#heart)"
  />
</svg>